version: '3.8'

# TaxMitra Enterprise — Development Database Stack
# Developer: Abhishek Agrahari | Kanpur, UP
# Usage: cd database && docker-compose up -d

services:
  postgres:
    image: postgres:15-alpine
    container_name: taxmitra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taxmitra
      POSTGRES_PASSWORD: taxmitra_secure_2026
      POSTGRES_DB: taxmitra_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d  # optional init scripts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxmitra -d taxmitra_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - taxmitra-net

  redis:
    image: redis:7-alpine
    container_name: taxmitra_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "taxmitra_redis_2026"
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "taxmitra_redis_2026", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - taxmitra-net

  # Optional: PgAdmin for DB management (comment out if not needed)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: taxmitra_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ca@taxmitra.in
      PGADMIN_DEFAULT_PASSWORD: taxmitra2026
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taxmitra-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  taxmitra-net:
    driver: bridge
