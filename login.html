<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign in – TaxMitra</title>
  <meta name="robots" content="noindex"/>
  <link rel="canonical" href="pages/account.html"/>
  <meta http-equiv="refresh" content="3; url=pages/account.html"/>
  <link rel="stylesheet" href="css/taxmitra.css"/>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1.25rem; }
    .box { max-width: 460px; width: 100%; text-align: center; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem 1.5rem; box-shadow: var(--shadow); }
    .box h1 { font-size: 1.2rem; margin-bottom: 0.6rem; }
    .box p { font-size: 0.88rem; color: var(--text-secondary); }
    .box a.btn-primary-solid { display: inline-block; margin-top: 1.1rem; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🔐 Sign-in has moved to GitHub</h1>
    <p>TaxMitra no longer uses an email-and-password form. Sign in with your GitHub account on the new Account page —
      real OAuth, no password stored, and separate data profiles for each account.</p>
    <p id="redirectNote" style="font-size:0.8rem;color:var(--text-muted)">Taking you there automatically…</p>
    <a class="btn-primary-solid" href="pages/account.html">Go to the Account page →</a>
  </div>
  <script>setTimeout(function () { location.replace('pages/account.html'); }, 2000);</script>
</body>
</html>
