name: 🚀 TaxMitra AI — Inject Keys + Deploy
on:
  push:
    branches: [arena/019fabf8-itr-and-gst, main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  inject-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate config with API keys from Secrets
        run: node build.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Commit injected config to branch (for legacy Pages serving)
        run: |
          git config user.name "TaxMitra CI"
          git config user.email "ci@taxmitra.dev"
          git add js/config-generated.js
          if ! git diff --staged --quiet; then
            git commit -m "ci: inject API keys into config [skip ci]"
            git push origin HEAD:arena/019fabf8-itr-and-gst
            echo "✅ Config with keys pushed to branch"
          else
            echo "ℹ️ No changes to commit"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
